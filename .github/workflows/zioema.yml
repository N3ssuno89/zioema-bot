name: ZioEMA bot

on:
  # ATTIVA LO SCHEDULE SOLO DOPO che le prime bozze su Telegram ti convincono.
  schedule:
  - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modalita:
        description: "Cosa fare"
        required: true
        default: seed
        type: choice
        options:
          - seed          # marca tutto come gia' visto, NON genera e NON manda
          - invia         # genera le bozze e le manda su Telegram
          - prova         # come 'invia' ma senza mandare niente

permissions:
  contents: write

concurrency:
  group: zioema-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Esegui
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ inputs.modalita }}" in
            seed)  python3 harvest.py --seed --all ;;
            prova) python3 harvest.py --dry-run --all ;;
            *)     python3 harvest.py --all ;;
          esac

      - name: Salva lo stato
        run: |
          git config user.name  "zioema-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json sigs.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "seen: $(date -u +%FT%TZ)"
          git push || true
