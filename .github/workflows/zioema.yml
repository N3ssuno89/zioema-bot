name: ZioEMA bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modalita:
        description: "Cosa fare"
        required: true
        default: invia
        type: choice
        options:
          - invia         # giro normale: genera e manda le bozze nuove
          - prova         # come invia, ma non manda e non salva niente
          - seed          # marca tutto come gia' visto (si fa una volta sola)
          - test-invio    # forza UN articolo, anche se gia' visto: serve a
                          # provare grafica + invio Telegram su un pezzo noto
      url:
        description: "URL articolo (solo per test-invio)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: zioema-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Esegui
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          URL:                ${{ inputs.url }}
        run: |
          case "${{ inputs.modalita }}" in
            seed)       python3 harvest.py --seed --all ;;
            prova)      python3 harvest.py --dry-run --all ;;
            test-invio) python3 zioema_bot.py "$URL" ;;
            *)          python3 harvest.py --all ;;
          esac

      - name: Salva lo stato
        if: ${{ inputs.modalita != 'test-invio' }}
        run: |
          git config user.name  "zioema-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json sigs.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "seen: $(date -u +%FT%TZ)"
          git push || true
